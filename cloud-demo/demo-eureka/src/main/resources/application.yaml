
spring:
  application:
    name: demo-eureka
server:
  port: 8761

eureka:
  instance:
    hostname: localhost
  client:
    fetch-registry: false
    register-with-eureka: false
    service-url:
      defaultZone: http://localhost:8761/eureka/

logging:
  level:
    com.netflix.discovery: DEBUG
    com.netflix.eureka: DEBUG

